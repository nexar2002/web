<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Préstamos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #fff;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 450px;
        }
        .form-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }
        label {
            flex: 1;
            text-align: left;
            font-weight: bold;
        }
        input, select {
            flex: 1.5;
            padding: 8px;
            border: 1px solid #000;
            border-radius: 5px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover {
            background-color: #333;
        }
        .table-container {
            width: 100%;
            overflow-x: auto; /* Evita el desbordamiento horizontal */
            margin-top: 20px;
        }
        table {
            width: 100%;
            min-width: 600px; /* Asegura que la tabla no se comprima demasiado */
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body>


    <div class="container">
        <img src="img/icon.jpg" alt="Logo" style="width: 100px; margin-bottom: 20px;"> 
        <h1>Calculadora de Préstamos</h1>
        
        <div class="form-group">
            <label for="monto">Monto:</label>
            <input type="number" id="monto" placeholder="Ingrese el monto">
        </div>

        <div class="form-group">
            <label for="plazo">Plazo (meses):</label>
            <input type="number" id="plazo" placeholder="Ingrese el plazo">
        </div>

        <div class="form-group">
            <label for="tasa">Interés (%):</label>
            <input type="number" id="tasa" placeholder="Ingrese la tasa">
        </div>

        <div class="form-group">
            <label for="metodo">Método:</label>
            <select id="metodo">
                <option value="frances">Francés</option>
                <option value="aleman">Alemán</option>
            </select>
        </div>
        
        <button onclick="calcularPrestamo()">Calcular</button>
        <a href="inicio.php">Regresar</a>
        <p id="resultado"></p>

        <div class="table-container">
            <table id="tabla"></table>
        </div>
    </div>

    <script>
        function calcularPrestamo() {
            let monto = parseFloat(document.getElementById("monto").value);
            let plazo = parseInt(document.getElementById("plazo").value);
            let tasa = parseFloat(document.getElementById("tasa").value) / 100 / 12;
            let metodo = document.getElementById("metodo").value;
            let resultado = document.getElementById("resultado");
            let tabla = document.getElementById("tabla");

            if (isNaN(monto) || isNaN(plazo) || isNaN(tasa) || plazo <= 0 || monto <= 0) {
                resultado.innerText = "Ingrese valores válidos";
                return;
            }

            let fechaInicio = new Date();
            let saldo = monto;
            let cuota, amortizacion, interes;
            let html = "<tr><th>Fecha de Pago</th><th>Mes</th><th>Cuota</th><th>Interés</th><th>Amortización</th><th>Saldo</th></tr>";

            for (let i = 1; i <= plazo; i++) {
                let fechaPago = obtenerSegundoDomingo(fechaInicio.getFullYear(), fechaInicio.getMonth() + i);

                if (metodo === "frances") {
                    cuota = (monto * tasa) / (1 - Math.pow(1 + tasa, -plazo));
                    interes = saldo * tasa;
                    amortizacion = cuota - interes;
                } else {
                    amortizacion = monto / plazo;
                    interes = saldo * tasa;
                    cuota = amortizacion + interes;
                }

                saldo -= amortizacion;
                html += `<tr>
                            <td>${fechaPago.toLocaleDateString()}</td>
                            <td>${i}</td>   
                            <td>${amortizacion.toFixed(2)}</td>
                            <td>${interes.toFixed(2)}</td>
                            <td>${cuota.toFixed(2)}</td>
                            <td>${saldo.toFixed(2)}</td>
                        </tr>`;
            }

            tabla.innerHTML = html;
            resultado.innerText = `Inicio: ${fechaInicio.toLocaleDateString()} - Fin: ${obtenerSegundoDomingo(fechaInicio.getFullYear(), fechaInicio.getMonth() + plazo).toLocaleDateString()}`;
        }

        function obtenerSegundoDomingo(anio, mes) {
    let fecha = new Date(anio + Math.floor(mes / 12), mes % 12, 1);
    let domingos = [];

    while (fecha.getMonth() === mes % 12) { // Asegura que estamos en el mes correcto
        if (fecha.getDay() === 0) { // 0 = Domingo
            domingos.push(new Date(fecha));
        }
        fecha.setDate(fecha.getDate() + 1);
    }

    return domingos.length >= 2 ? domingos[1] : domingos[0];
}

    </script>

</body>
</html>
